name: Release

# Builds per-platform binaries on tag push (v*) and attaches them to the GitHub
# Release. Binary name is `metabolopan` (Cargo.toml [package].name).
#
# Ships RAW binaries (tar.gz / zip) — no installer, no .app bundle. Each release
# carries Sigstore build provenance (actions/attest-build-provenance) + a
# SHA256SUMS manifest for verification. Windows Authenticode signing (SignPath
# Foundation, free for OSS) is scaffolded in the build job, commented out until
# the SignPath project is approved and SIGNPATH_API_TOKEN is set on this repo.
# macOS stays unsigned for now (notarization needs an Apple Developer Program
# cert — future change).
#
# Every target is built with an explicit `--target`, so the macOS Intel binary
# is CROSS-COMPILED on the Apple Silicon runner (macos-14). GitHub's native
# Intel runners (macos-13) are being retired and can leave a job queued for
# hours, so we never depend on them.
#
# Two phases: the matrix only BUILDS + uploads artifacts; a single `release`
# job then attaches them all, avoiding the parallel-matrix duplicate-release race.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the Release + upload assets

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target_label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            target_label: linux-x86_64
            bin: metabolopan
            archive: tar.gz
          - os: macos-14 # Apple Silicon (native)
            target: aarch64-apple-darwin
            target_label: macos-arm64
            bin: metabolopan
            archive: tar.gz
          - os: macos-14 # Apple Silicon runner, cross-compiling Intel
            target: x86_64-apple-darwin
            target_label: macos-x86_64
            bin: metabolopan
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            target_label: windows-x86_64
            bin: metabolopan.exe
            archive: zip
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false # release binaries do not bundle the LFS test fixtures

      # eframe / winit / rfd need a few system libs to LINK on Linux.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # --- FUTURE: Windows Authenticode signing (SignPath Foundation, free OSS) ---
      # Activate once the SignPath project is approved and SIGNPATH_API_TOKEN is set
      # on this repo. Sign metabolopan.exe HERE (before the zip step packages it),
      # and point the Windows zip step at signed/metabolopan.exe. The verify step
      # enforces "never ship an unsigned exe labelled as signed".
      #   - name: Upload unsigned exe for signing
      #     if: runner.os == 'Windows'
      #     id: unsigned
      #     uses: actions/upload-artifact@v6
      #     with: { name: unsigned-windows-exe, path: target/${{ matrix.target }}/release/metabolopan.exe }
      #   - name: Sign with SignPath
      #     if: runner.os == 'Windows'
      #     uses: SignPath/github-action-submit-signing-request@v1   # pin to a release tag
      #     with:
      #       api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #       organization-id: <signpath-org-id>
      #       project-slug: metabolopan
      #       signing-policy-slug: release-signing
      #       github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
      #       wait-for-completion: true
      #       output-artifact-directory: signed
      #   - name: Verify signature present
      #     if: runner.os == 'Windows'
      #     shell: pwsh
      #     run: signtool verify /pa signed/metabolopan.exe
      #
      # --- FUTURE: macOS Developer ID signing + notarization (needs Apple cert) ---
      #   codesign --options runtime --timestamp --sign "Developer ID Application: NAME (TEAMID)" <bin>
      #   ditto -c -k --keepParent <bin> <bin>.zip
      #   xcrun notarytool submit <bin>.zip --apple-id ID --team-id TEAMID --password APP_PW --wait
      #   (stapling needs a .app/.dmg/.pkg — a bare Mach-O cannot be stapled)

      # Bundle the committed English manual PDF (docs/manual/USER_MANUAL.pdf,
      # present in the checkout) into each archive in place of the old USER_MANUAL.md.
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" dist/
          cp README.md LICENSE NOTICE docs/manual/USER_MANUAL.pdf dist/
          tar -C dist -czf "metabolopan-${{ github.ref_name }}-${{ matrix.target_label }}.tar.gz" .

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" dist/
          Copy-Item README.md,LICENSE,NOTICE,docs/manual/USER_MANUAL.pdf dist/
          Compress-Archive -Path dist/* -DestinationPath "metabolopan-${{ github.ref_name }}-${{ matrix.target_label }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: metabolopan-${{ matrix.target_label }}
          path: metabolopan-${{ github.ref_name }}-${{ matrix.target_label }}.*
          if-no-files-found: error

  release:
    name: attach binaries to the Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release + upload assets
      id-token: write # OIDC, required by attest-build-provenance
      attestations: write # write the Sigstore build-provenance attestation
    steps:
      # Checkout to pick up the committed manual PDFs (docs/manual/*.pdf), which
      # are attached to the Release as standalone assets.
      - uses: actions/checkout@v5
        with:
          lfs: false

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Stage manual PDFs alongside the archives
        run: cp docs/manual/USER_MANUAL.pdf docs/manual/USER_MANUAL_zh-tw.pdf artifacts/

      # Hash the archives AND both committed manual PDFs (staged into artifacts/
      # above). The glob stays explicit so SHA256SUMS neither self-includes nor
      # picks up re-run residue. Written INTO artifacts/ so the attest step below
      # (subject-path: artifacts/*) covers the manifest too.
      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum *.tar.gz *.zip *.pdf > SHA256SUMS
          cat SHA256SUMS

      # Runs AFTER SHA256SUMS is written so the manifest is attested alongside the
      # archives. Build-host vs target arch is irrelevant here (post-build), so the
      # cross-compiled macOS Intel archive is attested identically.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/*

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          body: |
            ## metabolopan ${{ github.ref_name }}

            Raw per-platform binaries — no installer. macOS/Windows are not
            code-signed yet (see below), but every artifact carries build
            provenance and a `SHA256SUMS` manifest is attached.

            | platform | file |
            | --- | --- |
            | Linux x86_64 | `*-linux-x86_64.tar.gz` |
            | macOS Apple Silicon | `*-macos-arm64.tar.gz` |
            | macOS Intel | `*-macos-x86_64.tar.gz` |
            | Windows x86_64 | `*-windows-x86_64.zip` |

            The user manual is attached as `USER_MANUAL.pdf` (English) and
            `USER_MANUAL_zh-tw.pdf` (Traditional Chinese); the English PDF is also
            bundled inside each archive.

            **Verify your download** — every artifact (and `SHA256SUMS`) has Sigstore
            build provenance:
            `gh attestation verify <file> --repo SCArcherKuo/metabolopan`. Check
            integrity with `sha256sum -c SHA256SUMS`.

            **macOS** — first launch is blocked by Gatekeeper (unsigned): right-click
            the binary -> **Open**, or run `xattr -d com.apple.quarantine metabolopan`.
            **Windows** — SmartScreen: **More info** -> **Run anyway**.
            **All platforms** — the app stores its KEGG/PubChem cache + session logs
            under your OS data dir (macOS `~/Library/Application Support/metabolopan/`,
            Linux `~/.local/share/metabolopan/`, Windows `%APPDATA%\metabolopan\`).
