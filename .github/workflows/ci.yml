name: CI

# Formats, lints, tests and builds on the three host platforms, and guards the
# committed manual PDFs against going stale.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt + clippy + test + build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v5
        with:
          # The double-mode fixtures are tracked in Git LFS and are read by
          # NON-ignored integration tests (filter_unassigned_test,
          # auto_infer_stage1_test, data_msdial_test polarity tests after
          # retargeting). Without lfs:true those tests see pointer files and fail.
          lfs: true

      # eframe / winit / rfd need a few system libs to LINK on Linux.
      # (CI only builds + runs headless tests; it never opens the GUI.)
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          # Rust 2024 edition requires 1.85+. `stable` on GitHub runners is
          # well past that; pin a floor here only if you adopt an MSRV policy.
          components: rustfmt, clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (whole crate, warnings = errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (default set — #[ignore]d KEGG/HTTP smoke tests excluded)
        run: cargo test

      - name: Build release (catch release-only breakage)
        run: cargo build --release

  # Guard: the committed manual PDFs (docs/manual/*.pdf) must not go stale vs
  # their Markdown sources. Fails if a manual .md was committed more recently
  # than its .pdf — i.e. the manual was edited without rebuilding the PDF. Uses
  # last-commit timestamps (not a byte rebuild), so it does not depend on PDF
  # reproducibility or on a PDF toolchain being present in CI.
  #
  # Push-only. The PDFs are rebuilt by the maintainer, so a pull request that
  # edits a manual cannot satisfy this check; running it there would fail
  # contributors for something they cannot fix. On a push the .md and .pdf land
  # in separate commits when a rebuild is forgotten, so the case this guards
  # still trips.
  manuals:
    name: manual PDFs in sync
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
          fetch-depth: 0 # need full history for the last-commit-date comparison
      - name: Check each manual PDF is not older than its Markdown
        run: |
          set -euo pipefail
          fail=0
          for base in USER_MANUAL USER_MANUAL_zh-tw; do
            md="docs/manual/$base.md"
            pdf="docs/manual/$base.pdf"
            if [ ! -f "$pdf" ]; then
              echo "::error file=$pdf::$pdf is missing. The manual PDFs are rebuilt and committed by the maintainer."
              fail=1; continue
            fi
            md_t=$(git log -1 --format=%ct -- "$md")
            pdf_t=$(git log -1 --format=%ct -- "$pdf")
            if [ "$md_t" -gt "$pdf_t" ]; then
              echo "::error file=$md::$md changed after $pdf was last built. The manual PDFs are rebuilt and committed by the maintainer."
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "Manual PDFs are in sync with their Markdown sources."
          exit "$fail"
