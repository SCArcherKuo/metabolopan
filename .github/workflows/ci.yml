name: CI

# DRAFT — see todo/_release_v0.1.0/PLAN.md before landing.
# Open items flagged inline with `# VERIFY:`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt + clippy + test + build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          # double-mode-2 fixtures are tracked in Git LFS and are read by
          # NON-ignored integration tests (filter_unassigned_test,
          # auto_infer_stage1_test, data_msdial_test polarity tests after
          # retargeting). Without lfs:true those tests see pointer files and fail.
          lfs: true

      # eframe / winit / rfd need a few system libs to LINK on Linux.
      # (CI only builds + runs headless tests; it never opens the GUI.)
      # VERIFY this list on the first CI run — trim whatever turns out unneeded.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          # Rust 2024 edition requires 1.85+. `stable` on GitHub runners is
          # well past that; pin a floor here only if you adopt an MSRV policy.
          components: rustfmt, clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (whole crate, warnings = errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (default set — #[ignore]d KEGG/HTTP smoke tests excluded)
        run: cargo test

      - name: Build release (catch release-only breakage)
        run: cargo build --release
