[package]
name = "metabolopan"
version = "0.1.1"
edition = "2024"
authors = ["Shang-Che Kuo"]
description = "Cross-platform desktop GUI for metabolomic differential analysis (DAM) and KEGG over-representation analysis (ORA), built in Rust."
readme = "README.md"
license = "Apache-2.0"
keywords = ["metabolomics", "kegg", "enrichment-analysis", "ms-dial", "bioinformatics"]
categories = ["science", "gui"]

[dependencies]
polars = { version = "0.46", features = ["lazy", "csv"] }
statrs = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = "0.31"
egui = "0.31"
egui_extras = { version = "0.31", features = ["http", "image"] }
plotters = "0.3"
rfd = "0.15"
image = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
csv = "1.3"
ndarray = "0.16"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
rand = "0.8"
png = "0.18"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
dirs = "6.0.0"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
filetime = "0.2"
